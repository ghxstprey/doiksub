name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute short commit hash
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build doiksub
        run: pnpm build

      - name: Package plugin list
        run: pnpm generatePluginJson

      - name: Create release archive
        run: |
          mkdir -p release
          tar -czf release/doiksub.tar.gz \
            dist \
            package.json \
            pnpm-lock.yaml \
            src \
            scripts \
            README.md \
            LICENSE

      # The archive above ships the non-standalone dist (for Discord desktop injection).
      # The loose assets below are loaded by Vesktop forks (meoew.com) from a plain folder,
      # so they need the standalone build: http updater + no folded process.platform.
      - name: Build doiksub (standalone)
        env:
          DOIKSUB_HASH: ${{ steps.sha.outputs.short }}
        run: pnpm build --standalone

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The name must end in the commit hash (see src/shared/releaseHash.ts): both the
          # built-in updater and meoew.com read the hash from the release name.
          name: ${{ github.ref_name }} ${{ steps.sha.outputs.short }}
          files: |
            release/doiksub.tar.gz
            dist/vencordDesktopMain.js
            dist/vencordDesktopPreload.js
            dist/vencordDesktopRenderer.js
            dist/vencordDesktopRenderer.css
          generate_release_notes: true